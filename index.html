<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS2 Skin Trading Simulator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-content">
      <h1>🎮 CS2 Skin Trading Simulator</h1>

      <!-- Stats Bar -->
      <div class="stats-bar">
        <div class="stat-item">
          <div class="stat-label">Cash</div>
          <div class="stat-value" id="cash">$10,000.00</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Total Value</div>
          <div class="stat-value" id="totalValue">$10,000.00</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Profit/Loss</div>
          <div class="stat-value" id="profit">+0.0%</div>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button id="toggleMarket">▶️ Start Market</button>
        <button id="resetGame">🔄 Reset Game</button>
      </div>
    </div>
  </header>

  <main>
    <!-- Market List -->
    <section class="market-list" id="marketList">
      <!-- Skin cards will be dynamically generated here -->
    </section>
  </main>

  <footer>
    <div class="footer-content">
      <div>
        Last Update: <span id="lastUpdate">--:--:--</span>
      </div>
      <div>
        CS2 Skin Trading Simulator v1.0
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/game.js"></script>
  <script src="js/market.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
